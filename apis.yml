aid: perfect-day
name: Perfect Day
description: >-
  Perfect Day is a Berkeley, California food-technology company, founded in 2014, that makes
  animal-free dairy proteins with precision fermentation. Rather than farming cows, Perfect Day
  ferments microflora carrying milk's protein-coding genes to produce ProFerm, a non-animal whey
  protein with no lactose, cholesterol, hormones or antibiotics, which it sells business-to-business
  to consumer brands making ice cream, cream cheese, milk, yogurt, protein powders and bakery
  products. The company is a member of the Precision Fermentation Alliance. Perfect Day publishes no
  product or developer API; the single machine-readable surface it operates is the WordPress REST
  API (wp/v2) behind perfectday.com, which exposes anonymous read access to its blog posts, newsroom
  items, success stories, pages, media, taxonomies and site search, plus authenticated write
  operations via WordPress application passwords. This profile was enriched by the API Evangelist
  pipeline from that live surface.
