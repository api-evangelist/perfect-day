standards:
- id: oauth2
  conforms: false
  evidence: >-
    No oauth2 securityScheme in any spec; the only scheme is HTTP Basic (WordPress application
    passwords). /.well-known/oauth-authorization-server and /.well-known/oauth-protected-resource
    both returned 404.
- id: oidc
  conforms: false
  evidence: No openIdConnect scheme; /.well-known/openid-configuration returned 404.
- id: rfc9457-problem-details
  conforms: false
  evidence: >-
    Errors use the flat WordPress error envelope (code / message / data.status), not
    application/problem+json. Observed on live 401 and 404 responses.
- id: rfc8288-web-linking
  conforms: true
  evidence: >-
    Collection responses carry an RFC 8288 Link header with rel="next"/"prev" (observed on
    /wp/v2/posts), and item bodies include a _links object.
- id: pagination
  conforms: true
  evidence: >-
    Page-number pagination (page / per_page / offset) with X-WP-Total and X-WP-TotalPages response
    headers, exposed to browsers via Access-Control-Expose-Headers.
- id: idempotency
  conforms: false
  evidence: No idempotency-key header or parameter is exposed by any route.
- id: json
  conforms: true
  evidence: All operations negotiate application/json for request and response.
- id: openapi
  conforms: false
  evidence: >-
    Perfect Day publishes no OpenAPI document. The OpenAPI 3.1.0 documents in openapi/ were DERIVED
